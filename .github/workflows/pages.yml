name: TrendScout quality checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trendscout-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate report JSON
        run: python -m json.tool reports/latest.json > /dev/null
      - name: Build Cloudflare Pages output
        run: bash scripts/build_pages.sh
      - name: Verify generated site
        run: |
          test -s public/index.html
          test -s public/dashboard/index.html
          test -s public/sitemap.xml
          test -s public/robots.txt
          test -s public/guides/find-trending-github-repositories/index.html
